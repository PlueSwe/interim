[project]
name = "interim-radar"
version = "0.1.0"
description = "Bevakning av svenska chefsrekryteringar, interimuppdrag och offentliga upphandlingar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Bara nar AI_PROVIDER=anthropic. Systemet fungerar utan, se app/ai/provider.py.
ai = ["anthropic>=0.40"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integrationstesterna anropar verkliga API:er. De ska inte kora av sig sjalva
# -- vare sig i CI eller for den som bara vill veta om koden fungerar.
addopts = ["-m", "not integration"]
markers = [
    "integration: anropar verkliga externa API:er, kraver natverk",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI:s Depends() i standardvarden ar hela poangen med beroendesystemet.
    "B008",
    # UP042 vill ha enum.StrEnum i stallet for (str, Enum). Det gar inte: med
    # StrEnum blir str(medlem) sjalva vardet, och SQLAlchemy-kolumnerna,
    # Pydantic-schemana och de genererade TypeScript-unionerna bygger alla pa
    # att medlemmen serialiseras som sitt varde men skrivs ut som sitt namn.
    # Bytet vore en tyst beteendeandring genom hela modellagret.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Migreringen ar genererad och innehaller radata-DDL. Att bryta de raderna
# skulle gora dem svarare att jamfora med det modellerna faktiskt sager.
"migrations/versions/*.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
